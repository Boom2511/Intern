services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk_local
      POSTGRES_PASSWORD: helpdesk_local_dev_only
      POSTGRES_DB: helpdesk_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - helpdesk_postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_local -d helpdesk_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  helpdesk_postgres_local_data:
